<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Time</title>
    <link rel="stylesheet" href="./src/styles.css" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
  </head>
  <body>
    <nav aria-label="Primary navigation">
      <button
        class="menu-icon"
        type="button"
        aria-label="Expand navigation rail"
        aria-expanded="false"
      >
        <i class="fa-solid fa-bars"></i>
      </button>
      <ul class="rail-destinations">
        <li>
          <a href="#clock">
            <span class="destination-indicator">
              <i class="fa-regular fa-clock" aria-hidden="true"></i>
            </span>
            <span class="destination-label">Clock</span>
          </a>
        </li>
        <li>
          <a href="#alarm">
            <span class="destination-indicator">
              <i class="fa-solid fa-bell" aria-hidden="true"></i>
            </span>
            <span class="destination-label">Alarm</span>
          </a>
        </li>
        <li>
          <a href="#stopwatch">
            <span class="destination-indicator">
              <i class="fa-solid fa-stopwatch" aria-hidden="true"></i>
            </span>
            <span class="destination-label">Stopwatch</span>
          </a>
        </li>
        <li>
          <a href="#timer">
            <span class="destination-indicator">
              <i class="fa-solid fa-hourglass-half" aria-hidden="true"></i>
            </span>
            <span class="destination-label">Timer</span>
          </a>
        </li>
      </ul>
    </nav>
    <main>
      <section id="clock">
        <x-clock>
          <time>00:00:00</time>
        </x-clock>
      </section>
      <section id="alarm">
        <x-alarm>
          <template>
            <section class="alarms">
              <input
                type="time"
                min="00:00"
                max="23:59"
                step="1"
                aria-label="Alarm time"
              />
              <section class="controls">
                <button
                  class="start material-icons"
                  type="button"
                  aria-label="Start alarm"
                >
                  alarm_on
                </button>
                <button
                  class="pause material-icons"
                  type="button"
                  aria-label="Pause alarm"
                >
                  alarm_off
                </button>
                <button
                  class="delete material-icons"
                  type="button"
                  aria-label="Delete alarm"
                >
                  delete
                </button>
              </section>
            </section>
          </template>
          <section class="items"></section>
          <section class="controls">
            <button
              class="add material-icons"
              type="button"
              aria-label="Add alarm"
            >
              add_alarm
            </button>
          </section>
        </x-alarm>
      </section>
      <section id="stopwatch">
        <x-stopwatch>
          <time datetime="PT0S">00:00:00.00</time>
          <section class="controls">
            <button
              class="start material-icons"
              type="button"
              aria-label="Start stopwatch"
            >
              timer
            </button>
            <button
              class="pause material-icons"
              type="button"
              aria-label="Pause stopwatch"
            >
              timer_off
            </button>
            <button
              class="restart material-icons"
              type="button"
              aria-label="Reset stopwatch"
            >
              restart_alt
            </button>
          </section>
        </x-stopwatch>
      </section>
      <section id="timer">
        <x-timer>
          <time datetime="PT0S">00:00:00.00</time>
          <section class="items">
            <section class="timers">
              <input
                type="time"
                min="00:00:00"
                max="23:59:59"
                value="00:03:00"
                step="1"
                aria-label="First timer interval"
              />
              <input
                type="time"
                min="00:00:00"
                max="23:59:59"
                value="00:01:00"
                step="1"
                aria-label="Second timer interval"
              />
            </section>
          </section>
          <section class="controls">
            <button
              class="start material-icons"
              type="button"
              aria-label="Start timer"
            >
              timer
            </button>
            <button
              class="pause material-icons"
              type="button"
              aria-label="Pause timer"
            >
              timer_off
            </button>
            <button
              class="restart material-icons"
              type="button"
              aria-label="Reset timer"
            >
              restart_alt
            </button>
            <button
              class="loop material-icons"
              type="button"
              aria-label="Enable timer loop"
            >
              loop
            </button>
            <button
              class="no-loop material-icons"
              type="button"
              aria-label="Disable timer loop"
            >
              sync_disabled
            </button>
          </section>
        </x-timer>
      </section>
    </main>
    <script type="module" src="./src/app.js"></script>
  </body>
</html>
