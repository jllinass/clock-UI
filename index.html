<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Time</title>
    <link rel="stylesheet" href="./src/styles.css" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
  </head>
  <body>
    <nav aria-label="Primary navigation">
      <button
        class="menu-icon"
        type="button"
        aria-label="Expand navigation rail"
        aria-expanded="false"
      >
        <i class="fa-solid fa-bars"></i>
      </button>
      <ul class="rail-destinations">
        <li>
          <a href="#clock">
            <span class="destination-indicator">
              <i class="fa-regular fa-clock" aria-hidden="true"></i>
            </span>
            <span class="destination-label">Clock</span>
          </a>
        </li>
        <li>
          <a href="#alarm">
            <span class="destination-indicator">
              <i class="fa-solid fa-bell" aria-hidden="true"></i>
            </span>
            <span class="destination-label">Alarm</span>
          </a>
        </li>
        <li>
          <a href="#stopwatch">
            <span class="destination-indicator">
              <i class="fa-solid fa-stopwatch" aria-hidden="true"></i>
            </span>
            <span class="destination-label">Stopwatch</span>
          </a>
        </li>
        <li>
          <a href="#timer">
            <span class="destination-indicator">
              <i class="fa-solid fa-hourglass-half" aria-hidden="true"></i>
            </span>
            <span class="destination-label">Timer</span>
          </a>
        </li>
      </ul>
    </nav>
    <main>
      <section id="clock">
        <x-clock>
          <time>00:00:00</time>
        </x-clock>
      </section>
      <section id="alarm">
        <x-alarm>
          <template>
            <section class="alarms">
              <input
                type="time"
                min="00:00"
                max="23:59"
                step="1"
                aria-label="Alarm time"
              />
              <input
                type="text"
                class="alarm-description"
                placeholder="Alarm description"
                aria-label="Alarm description"
              />
              <section class="controls">
                <button
                  class="start material-icons"
                  type="button"
                  aria-label="Start alarm"
                >
                  alarm_on
                </button>
                <button
                  class="pause material-icons"
                  type="button"
                  aria-label="Pause alarm"
                >
                  alarm_off
                </button>
                <button
                  class="delete material-icons"
                  type="button"
                  aria-label="Delete alarm"
                >
                  delete
                </button>
              </section>
            </section>
          </template>
          <section class="items"></section>
          <form class="alarm-form" hidden>
            <h2>New alarm</h2>
            <label for="new-alarm-time">Time</label>
            <input id="new-alarm-time" type="time" required />
            <label for="new-alarm-description">Description</label>
            <input
              id="new-alarm-description"
              class="alarm-description"
              type="text"
              placeholder="Add a note..."
            />
            <section class="controls">
              <button class="save-alarm" type="submit">Save alarm</button>
              <button class="cancel-alarm" type="button">Cancel</button>
            </section>
          </form>
          <section class="controls">
            <button
              id="addAlarm"
              class="add material-icons"
              type="button"
              aria-label="Add alarm"
            >
              add_alarm
            </button>
          </section>
        </x-alarm>
      </section>
      <section id="stopwatch">
        <x-stopwatch>
          <div class="stopwatch-heading">
            <h2>Stopwatch</h2>
          </div>
          <time datetime="PT0S">00:00:00.00</time>
          <section class="controls">
            <button
              id="startStopwatch"
              class="start material-icons"
              type="button"
              aria-label="Start stopwatch"
            >
              timer
            </button>
            <button
              id="pauseStopwatch"
              class="pause material-icons"
              type="button"
              aria-label="Pause stopwatch"
              style="display: none"
            >
              timer_off
            </button>
            <button
              id="restartStopwatch"
              class="restart material-icons"
              type="button"
              aria-label="Reset stopwatch"
              style="display: none"
            >
              restart_alt
            </button>
            <button
              id="mark"
              class="mark material-icons"
              type="button"
              aria-label="Save time"
              style="display: none"
            >
              flag
            </button>
          </section>
          <div class="marksList">
            <h3 id="markTitle" style="display: none">Marks</h3>
            <ol id="lapsList"></ol>
          </div>
        </x-stopwatch>
      </section>
      <section id="timer">
        <x-timer>
          <div class="timer-heading">
            <h2>Timer</h2>
          </div>
          <time datetime="PT0S">00:00:00.00</time>
          <section class="timer-settings">
            <label for="timer-duration">Duration</label>
            <input
              id="timer-duration"
              type="time"
              min="00:00:00"
              max="23:59:59"
              value="00:00:00"
              step="1"
            />
          </section>
          <section class="controls">
            <button
              class="start material-icons"
              type="button"
              aria-label="Start timer"
            >
              timer
            </button>
            <button
              class="pause material-icons"
              type="button"
              aria-label="Pause timer"
            >
              timer_off
            </button>
            <button
              class="restart material-icons"
              type="button"
              aria-label="Reset timer"
            >
              restart_alt
            </button>
            <button
              class="loop material-icons"
              type="button"
              aria-label="Repeat timer"
              aria-pressed="false"
            >
              loop
            </button>
            <button
              class="no-loop material-icons"
              type="button"
              aria-label="Do not repeat timer"
              aria-pressed="true"
            >
              sync_disabled
            </button>
          </section>
        </x-timer>
      </section>
    </main>
    <script type="module" src="./src/app.js"></script>
  </body>
</html>
